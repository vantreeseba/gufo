name: Publish runtime image

# Builds the upstream gufo-runtime OCI image (gufo-org/toolboxes) with this
# repository's engine in place of the pinned one, and publishes it to this
# repository's GitHub Container Registry package.

on:
  push:
    branches: [ feat/qwen35moe-35b-a3b ]
  workflow_dispatch:
    inputs:
      toolboxes-ref:
        description: gufo-org/toolboxes branch, tag or commit that defines the image
        required: false
        default: main

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and push gufo-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker system prune --all --force
          df -h /

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          determinate: false

      - name: Build image
        env:
          TOOLBOXES_REF: ${{ inputs.toolboxes-ref || 'main' }}
        run: |
          nix run "github:gufo-org/toolboxes/${TOOLBOXES_REF}#stream-gufo-runtime" \
            --override-input gufo-engine "github:${GITHUB_REPOSITORY}/${GITHUB_SHA}" \
            --no-write-lock-file --print-build-logs \
            | docker load
          df -h /

      - name: Push image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          branch_tag="$(printf '%s' "${GITHUB_REF_NAME}" | tr -c 'A-Za-z0-9_.-' '-')"
          printf '%s' "${GITHUB_TOKEN}" \
            | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          for tag in "${branch_tag}" "sha-${GITHUB_SHA}"; do
            docker tag ghcr.io/gufo-org/toolboxes/gufo-runtime:edge "${image}:${tag}"
            docker push "${image}:${tag}"
            echo "Pushed ${image}:${tag}" >> "${GITHUB_STEP_SUMMARY}"
          done
